<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d5e0e8">
<title>ЖК «Премиум» · 3D</title>
<style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d5e0e8;color:#18241e;font:14px/1.4 system-ui,sans-serif}
    [hidden]{display:none!important}
    #scene{position:fixed;inset:0;touch-action:none}
    canvas{display:block}
    .views{position:fixed;bottom:max(17px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:3px;padding:4px;border:1px solid #ffffff77;border-radius:22px;background:#f7f6eef0;box-shadow:0 4px 24px #17231e30;white-space:nowrap}
    .views button{font:inherit;color:inherit;padding:7px 13px;border:0;border-radius:18px;min-height:40px;background:transparent;cursor:pointer;touch-action:manipulation}
    .views button[aria-pressed="true"]{color:#fff;background:#2d473b}
    .views button:hover:not([aria-pressed="true"]){background:#e4e8e0}
    .views button:focus-visible{outline:2px solid #4f7966;outline-offset:2px}
    .loading{position:fixed;inset:0;margin:0;display:grid;place-items:center}
    @media(max-width:430px){.views button{padding-inline:10px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="scene" aria-label="Интерактивный 3D-макет ЖК «Премиум»"></div>
<p class="loading" role="status">Загружаем 3D-макет…</p>
<nav class="views" aria-label="Ракурсы макета" hidden>
    <button type="button" data-view="street" aria-pressed="true">Улица</button>
    <button type="button" data-view="entry" aria-pressed="false">Вход</button>
    <button type="button" data-view="court" aria-pressed="false">Двор</button>
    <button type="button" data-view="overview" aria-pressed="false">Сверху</button>
</nav>
<script type="module">
    import('./premium-scene.js?v=daylight-20261126').catch(error=>{
        console.error(error);
        document.querySelector('.loading').textContent='Не удалось загрузить 3D-макет. Обновите страницу.';
    });
</script>
</body>
</html>
